name: Build Vizmo LearnHouse image

on:
  push:
    branches: [codex/hide-signup-1.3.6]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: LEARNHOUSE_PUBLIC=true
          tags: ghcr.io/${{ github.repository_owner }}/learnhouse:sha-${{ github.sha }}
